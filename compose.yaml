services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orqenta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orqenta"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment:
      # inside the network the host is "db"; from your machine it's localhost:5432
      DATABASE_URL: postgres://postgres:postgres@db:5432/orqenta
      # ponytail: bind-mount file events are unreliable on Windows; drop if HMR works without it
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
